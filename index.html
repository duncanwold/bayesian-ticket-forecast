function bayes(filteredEvents, initial_tix, tix_delta, initial_time, time_delta, max_tix, smooth_by, weightedVals_show, weight_show, weightedVals_org, weight_org){
	
	var eStates = [];
    events_in_state.length = 0;
	
	var minTix = initial_tix - tix_delta;
	var maxTix = initial_tix + tix_delta;
	
	console.log("Tickets Range: " + minTix + " - " + maxTix);
	console.log("Date Range: " + (initial_time-time_delta) + "hrs - " + (initial_time+time_delta) + "hrs");
	
	var count_state = 0;

	for (i=0; i<filteredEvents.length; i++){
		var atn_counter = 0;
		var inState = false;
	
		var eDate = new Date(filteredEvents[i].start.utc);
		var minDate = new Date(eDate);
		minDate.setHours(minDate.getHours() - (initial_time + time_delta) );
		var maxDate = new Date(eDate);
		maxDate.setHours(maxDate.getHours() - (initial_time - time_delta) );
		
		//THIS IS WHERE WE DECIDE WHICH EVENTS ARE IN STATE
		if (filteredEvents[i]['id'] in idAttendees){ //We're keeping events that ended at 0 attendees, is that a good idea?
			
			for (j=0; j<idAttendees[ filteredEvents[i]['id'] ].length; j++){
				atn_counter+=1;
				var atnDate = new Date(idAttendees[filteredEvents[i]['id']][j].created);
			
				//PART 1: Check if we're in the date range when we hit the min ticket threshold.
                //Basically, detect hitting the bottom of the box.
				//Currently won't work with min of 0
				if ( atn_counter === minTix && atnDate <= maxDate && atnDate >= minDate && inState === false){
					inState = true;
				}
				
				//PART 2: Check if we're in the ticket range when we hit the min date threshold
                //Basically, detect hitting the left side of the box.
				if(j > 0 && inState === false){ // Don't run on first iteration. Don't run if inState = true
					var atnDatePrime = new Date(idAttendees[ filteredEvents[i]['id'] ][j-1].created);
					if(atnDatePrime <= minDate && atnDate >= minDate && (atn_counter-1) >= minTix && (atn_counter-1) <= maxTix){
						inState = true;
					}
				}
				
			}
            
			//Right now we're only pushing IF there were some attendees. Could push either way.
			eStates.push({
				"inState": inState,
				"atn_final": atn_counter
                //"atn_final": idAttendees[filteredEvents[i].id].length
				});
				
			if(inState === true){
				count_state += 1;
                events_in_state.push(filteredEvents[i]);
                console.log(filteredEvents[i].name.text + " | " + filteredEvents[i]['id'] + " (" + idAttendees[filteredEvents[i]['id']].length + ")");
			}
		}
	}
    
    //Sort the Events in state by number of final attendees
    events_in_state.sort(function(a, b) {
        let lengthA = idAttendees[a.id] ? idAttendees[a.id].length : 0;
        let lengthB = idAttendees[b.id] ? idAttendees[b.id].length : 0;
        return lengthA - lengthB; // For descending order, use lengthA - lengthB for ascending order
    });
    
    //Uncomment the code below to see which events were in state
    /*console.log("Events In State : " + events_in_state.length);
    for(i=0;i<events_in_state.length;i++){
        console.log("Name : " + events_in_state[i].name.text);
        console.log("Date : " + events_in_state[i].start.local);
        console.log("Attendance : " + idAttendees[events_in_state[i].id].length);
    }*/
	
	count_state += weightedVals_show.length*weight_show;
	count_state += weightedVals_org.length*weight_org;
	
	var Prob_state=count_state/(eStates.length + weightedVals_show.length*weight_show + weightedVals_org.length*weight_org);
	//console.log("Prob State : " + Prob_state)
	var Prob_final = [];

	for (n=0;n<=max_tix;n++){
		var count_n = 0;
		
		for(j=0;j<eStates.length;j++){	
			if (eStates[j].atn_final === n){
				count_n += 1.0;
			}
		}
		
		count_n += countInArray(weightedVals_show,n)*weight_show;
		count_n += countInArray(weightedVals_org,n)*weight_org;
		
		//console.log("count_n : " + count_n + " / eStates.length : " + eStates.length )
		
		Prob_final[n]=count_n/(eStates.length + weightedVals_show.length*weight_show + weightedVals_org.length*weight_org);
		
		//console.log("Prob Final for " + n + " final tix : " + Prob_final[n])
	}
	
	var Prob_final_state = [];
	
	for (n=0;n<=max_tix;n++){
		var count_state_final = 0;
		var count_final = 0;
	
		for (j=0;j<eStates.length;j++){
			if ( eStates[j].atn_final === n ){
				count_final += 1.0;
				if ( eStates[j].inState === true){
					count_state_final += 1.0;
				}
			}
		}
		
		count_final += countInArray(weightedVals_show,n)*weight_show;
		count_state_final += countInArray(weightedVals_show,n)*weight_show;
		
		count_final += countInArray(weightedVals_org,n)*weight_org;
		count_state_final += countInArray(weightedVals_org,n)*weight_org;
		
		if (count_final > 0){ var Prob_state_final = count_state_final/count_final; }
		else{ var Prob_state_final = 0; }
		
		//console.log("Prob State | Final for " + n + " final tix : " + Prob_state_final);
	
		if ( Prob_state > 0 ) { prob = Prob_state_final * Prob_final[n] / Prob_state;}
		else { prob = 0; }
	
		Prob_final_state[n]= {
			"prob" : prob,
			"num_points_0" : count_state_final,
			"num_points_1" : count_state
			}
	}
	
	//Apply smoothing
	var Prob_smooth = [];
	
	for (n=0 ; n< Prob_final_state.length ; n++){
		var p_smooth = 0;
		var total_weight = 0;
		
		for(j=smooth_by*(-1) ; j<=smooth_by ; j++){
			if(n+j<0 || n+j >= Prob_final_state.length ){ continue; }
			weight_factor = Math.pow((parseInt(smooth_by)+1)-Math.abs(j), .5);
			p_smooth += Prob_final_state[n+j].prob * weight_factor;
			total_weight += weight_factor;
		}
		
		p_smooth /= total_weight;
		
		Prob_smooth[n]= {
			"prob" : p_smooth,
			"num_points_0" : Prob_final_state[n].num_points_0,
			"num_points_1" : Prob_final_state[n].num_points_1
			}
	}
	
	//SANITY CHECK
	var sanityCheck = 0;
	for(n=0; n<Prob_smooth.length; n++){
		sanityCheck += Prob_smooth[n].prob;
	}
	console.log("SANITY CHECK (Should equal 1): " + sanityCheck);
	
	return Prob_smooth;
}

function countInArray(array, num) {
    var numCount = 0;
    for (var k = 0; k < array.length; k++) {
        if (array[k] === num) {
            numCount++;
        }
    }
    return numCount;
}

function eTixSold(eId, days, hours){
	var count = 0;
	
	var eDate_0 = new Date(idEvents[eId].start.utc);
	var eDate_1 = eDate_0;
	eDate_1.setDate(eDate_1.getDate() - days);
	eDate_1.setHours(eDate_1.getHours() - hours);

	if ( eId in idAttendees){
		for (atn=0; atn<idAttendees[eId].length; atn++){
		
			var atnDate = new Date(idAttendees[eId][atn].created)
			if (atnDate < eDate_1){
				count+=1;
			}	
		}
	}
		
	return count;
}

function credible_interval (Prob_b0_b1, critical_perc){
	var mean = 0;
	
	for(n=0;n<Prob_b0_b1.length;n++){
		mean+=(Prob_b0_b1[n].prob) * (n);
	}

	//Calculate Credible Interval
    var critical_perc = parseInt($("#input-confidence").val()) * .01;
	var ci_perc = 0;
	var ci_min = Math.round(mean);
	var ci_max = Math.round(mean);
	
	ci_perc += Prob_b0_b1[ci_max].prob;
	
	while (ci_perc < critical_perc){
		ci_min -= 1;
		ci_max += 1;
		
		ci_perc += Prob_b0_b1[ci_min].prob;
		ci_perc += Prob_b0_b1[ci_max].prob;
	}
	
	// trim edges
	while (Prob_b0_b1[ci_min].prob === 0){ ci_min += 1; }
	while (Prob_b0_b1[ci_max].prob === 0){ ci_max -= 1; }
	
	return [ci_min, ci_max, ci_perc];
}
    
function sortByDate(arr) {
    return arr.sort((a, b) => {
        // Convert the 'created' date strings to Date objects
        let dateA = new Date(a.created);
        let dateB = new Date(b.created);

        // Compare the dates
        return dateA - dateB;
    });
}
